<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tech Passion Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root { --bg: #F3F4F1; --card: #FFFFFF; --fg: #15181D; --muted: #565C63; --line: #D6D9D2; --accent: #1F49D6; --on-accent: #FFFFFF; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0F1215; --card: #171B20; --fg: #E9EBEE; --muted: #9AA2AB; --line: #2A3038; --accent: #8EA6FF; --on-accent: #0F1215; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0F1215; --card: #171B20; --fg: #E9EBEE; --muted: #9AA2AB; --line: #2A3038; --accent: #8EA6FF; --on-accent: #0F1215; color-scheme: dark; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, "Segoe UI", sans-serif; }
main { min-height: 70vh; display: grid; place-items: center; padding-block: 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 28px; max-width: 520px; width: 100%; display: flex; flex-direction: column; gap: 14px; }
.eyebrow { font: 500 12px ui-monospace, monospace; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font-size: 30px; line-height: 1.1; letter-spacing: -.02em; text-wrap: balance; }
.ar { color: var(--muted); direction: rtl; text-align: left; unicode-bidi: plaintext; margin-top: -8px; }
p { margin: 0; color: var(--fg); }
.row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
a.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 20px; border-radius: 10px; font-weight: 600; text-decoration: none; }
a.primary { background: var(--accent); color: var(--on-accent); }
a.ghost { border: 1px solid var(--line); color: var(--fg); }
.note { font-size: 13px; color: var(--muted); }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <div class="card">
    <span class="eyebrow">Working demo</span>
    <h1>Tech Passion</h1>
    <div class="ar" lang="ar">هاردوير عربي</div>
    <p>Browse the magazine: reviews, PC build guides and news.</p>
    <div class="row">
      <a class="btn primary" href="hardware/index.html">Open the demo</a>
      <a class="btn ghost" href="../index.html#hardware">Back to the portfolio</a>
    </div>
    <p class="note">Runs entirely in your browser on demo data. Nothing you do reaches a real system, and changes reset when you close the tab.</p>
  </div>
</main>

</body>
</html>
